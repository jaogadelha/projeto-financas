<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finanças – controle financeiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fundo animado -->
  <canvas id="bg"></canvas>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="wrap">

    <!-- Topo: nome e mês -->
    <header>
      <div class="brand">FINANÇAS</div>
      <div class="month">
        <button id="prev" aria-label="Mês anterior">‹</button>
        <span id="mlabel"></span>
        <button id="next" aria-label="Próximo mês">›</button>
      </div>
    </header>

    <!-- Cartão principal: saldo -->
    <section class="card-main">
      <p>Saldo do mês</p>
      <div id="saldo" class="big">R$ 0,00</div>
      <p id="delta"></p>
      <svg id="spark" viewBox="0 0 400 110" preserveAspectRatio="none"></svg>
      <div class="pills">
        <div><span>Entrou</span><b id="inc"></b></div>
        <div><span>Saiu</span><b id="out"></b></div>
        <div><span>Sobrou da renda</span><b id="rate"></b></div>
      </div>
    </section>

    <!-- Botões de ação -->
    <div class="actions">
      <button id="openIn" class="gain">Adicionar entrada</button>
      <button id="open" class="spend">Adicionar saída</button>
    </div>

    <!-- Gráficos -->
    <section class="grid2">
      <div class="panel">
        <h2>Para onde o dinheiro foi</h2>
        <div class="donut">
          <svg id="donut" viewBox="0 0 150 150"></svg>
          <ul id="legend"></ul>
        </div>
      </div>
      <div class="panel">
        <h2>Últimos 6 meses</h2>
        <svg id="bars" viewBox="0 0 360 150"></svg>
        <p class="mute"><span class="pos">■</span> entradas &nbsp; <span class="neg">■</span> saídas</p>
      </div>
    </section>

    <!-- Lista de transações -->
    <section class="panel">
      <div class="lh">
        <h2>Transações</h2>
        <div class="chips" id="chips">
          <button data-f="all" class="on">Todas</button>
          <button data-f="in">Entradas</button>
          <button data-f="out">Saídas</button>
        </div>
      </div>
      <ul id="list"></ul>
    </section>

    <footer>
      <span>Os dados ficam salvos só neste navegador.</span>
      <div>
        <button id="reset">Voltar aos exemplos</button>
        <button id="clear">Apagar tudo</button>
      </div>
    </footer>
  </div>

  <!-- Janela de nova transação -->
  <div class="ov" id="ov">
    <form id="form">
      <h2>Nova transação</h2>
      <div class="seg">
        <button type="button" id="tout" class="on o">Saída</button>
        <button type="button" id="tin">Entrada</button>
      </div>
      <input id="desc" placeholder="Descrição (ex: almoço)" maxlength="40">
      <input id="val" type="number" step="0.01" min="0.01" placeholder="Valor em R$" required>
      <select id="cat"></select>
      <input id="date" type="date" required>
      <div class="row">
        <button type="button" id="cancel">Cancelar</button>
        <button class="add" style="flex:1">Salvar transação</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
